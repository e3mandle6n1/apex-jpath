name: Apex Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        uses: ./.github/actions/install-salesforce-cli

      - name: Authenticate to Dev Hub
        uses: ./.github/actions/authenticate-devhub
        with:
          auth-url: ${{ secrets.SFDX_AUTH_URL }}

      - name: Create scratch org
        uses: ./.github/actions/create-scratch-org

      - name: Deploy source to scratch org
        uses: ./.github/actions/deploy-source

      - name: Run Apex tests
        uses: ./.github/actions/run-apex-tests

      - name: Delete scratch org
        if: always()
        uses: ./.github/actions/delete-scratch-org
